name: Release

# 推送形如 1.0.3 的版本 tag 时自动构建、校验并发布 GitHub Release。
# Release 只包含 Obsidian 社区插件要求的 main.js / manifest.json / styles.css，
# 并附带 GitHub Artifact Attestations（构建来源可验证）。

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          npm run lint
          npm run lint:styles

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      # tag 与 manifest 版本号必须一致，否则商店里的版本号会和实际代码
      # 对不上（用户升级不到真正的修复版本）。这是本仓库唯一防止
      # 「打错 tag 就发版」的闸门。
      - name: Verify tag matches manifest version
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "$manifest_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest version $manifest_version"
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
